- name: Installa e configura Apache sui Workers
  hosts: workers
  become: true

  tasks:

    - name: Installa Apache e mod_ssl
      dnf:
        name:
          - httpd
          - mod_ssl
          - policycoreutils-python-utils
        state: present
        update_cache: true

    - name: Crea document root
      file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Crea directory certificati
      file:
        path: /etc/httpd/ssl
        state: directory
        mode: '0755'

    - name: Configura SELinux porta 444
      seport:
        ports: 444
        proto: tcp
        setype: http_port_t
        state: present

    - name: Genera certificato autofirmato
      command: >
        openssl req -new -newkey rsa:2048
        -days 365 -nodes -x509
        -subj "/C=IT/ST=Italy/L=Rome/O=MyCompany/OU=IT/CN=example.com"
        -keyout /etc/httpd/ssl/key.pem
        -out /etc/httpd/ssl/cert.pem
      args:
        creates: /etc/httpd/ssl/cert.pem

    - name: Configura porte Apache
      copy:
        dest: /etc/httpd/conf.d/ports.conf
        mode: '0644'
        content: |
          Listen 81
          Listen 444

    - name: Configura SSL Worker
      copy:
        dest: /etc/httpd/conf.d/ssl-worker.conf
        mode: '0644'
        content: |
          <VirtualHost *:444>
              ServerAdmin admin@example.com
              DocumentRoot /var/www/html

              SSLEngine on
              SSLCertificateFile /etc/httpd/ssl/cert.pem
              SSLCertificateKeyFile /etc/httpd/ssl/key.pem

              SSLProtocol -all +TLSv1.2 +TLSv1.3

              ErrorLog logs/ssl_error_log
              CustomLog logs/ssl_access_log combined
          </VirtualHost>

    - name: Configura firewall porta 81
      firewalld:
        port: 81/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Configura firewall porta 444
      firewalld:
        port: 444/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Verifica configurazione Apache
      command: httpd -t
      changed_when: false

    - name: Abilita e riavvia Apache
      service:
        name: httpd
        state: restarted
        enabled: true

- name: Configura Load Balancer
  hosts: loadbalancer
  become: true

  vars:
    lb_ip_address: "{{ ansible_host | default('192.168.56.10') }}"

  tasks:

    - name: Installa Apache e mod_ssl
      dnf:
        name:
          - httpd
          - mod_ssl
          - policycoreutils-python-utils
        state: present
        update_cache: true

    - name: Crea directory certificati
      file:
        path: /etc/httpd/ssl
        state: directory
        mode: '0755'

    - name: Configura SELinux porta 444
      seport:
        ports: 444
        proto: tcp
        setype: http_port_t
        state: present

    - name: Abilita connessioni outbound Apache
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Configura porte Apache
      copy:
        dest: /etc/httpd/conf.d/ports.conf
        mode: '0644'
        content: |
          Listen 81
          Listen 444

    - name: Configura Load Balancer HTTPS
      copy:
        dest: /etc/httpd/conf.d/load_balancer.conf
        mode: '0644'
        content: |
          <Proxy "balancer://my_backend">
              BalancerMember https://192.168.56.11:444
              BalancerMember https://192.168.56.12:444
              ProxySet lbmethod=byrequests
          </Proxy>

          <VirtualHost *:81>
              ServerName {{ lb_ip_address }}

              Redirect permanent / https://{{ lb_ip_address }}:444/
          </VirtualHost>

          <VirtualHost *:444>
              ServerName {{ lb_ip_address }}

              SSLEngine on
              SSLCertificateFile /etc/httpd/ssl/cert.pem
              SSLCertificateKeyFile /etc/httpd/ssl/key.pem

              ProxyPreserveHost On

              SSLProxyEngine On
              SSLProxyVerify None
              SSLProxyCheckPeerCN Off
              SSLProxyCheckPeerName Off

              ProxyPass / balancer://my_backend/
              ProxyPassReverse / balancer://my_backend/

              RequestHeader set X-Forwarded-Proto "https"
              RequestHeader set X-Forwarded-Port "444"

              ErrorLog logs/balancer_ssl_error_log
              CustomLog logs/balancer_ssl_access_log combined
          </VirtualHost>

    - name: Configura firewall porta 81
      firewalld:
        port: 81/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Configura firewall porta 444
      firewalld:
        port: 444/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Verifica configurazione Apache
      command: httpd -t
      changed_when: false

    - name: Riavvia Apache
      service:
        name: httpd
        state: restarted
        enabled: true