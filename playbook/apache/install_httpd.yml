#installa apache httpd su fedora
---
- name: Installa e configura Apache HTTPD su Fedora
  hosts: all
  become: yes
  vars:
    httpd_port: 81
  tasks:
    - name: Installa il pacchetto httpd
      dnf:
        name: httpd
        state: present

    - import_tasks: tasks/firewall.yml
    - import_tasks: tasks/ssl_httpd.yml
    
    - name: Avvia Apache
      service:
        name: httpd
        state: restarted
        enabled: true