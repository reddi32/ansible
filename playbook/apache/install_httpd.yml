---
- name: Installa e configura Apache con SSL e Firewall (Workers)
  hosts: workers
  become: true
  tasks:
    - name: Verifica e installa Apache e mod_ssl
      dnf:
        name:
          - httpd
          - mod_ssl
        state: present
        update_cache: true

    - name: Mostra messaggio di conferma per l'installazione di Apache
      debug:
        msg: "Apache e mod_ssl sono stati installati correttamente sui worker."

    - name: Crea la directory per il sito web di Apache
      file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Assicura la presenza della directory conf.d
      file:
        path: /etc/httpd/conf.d
        state: directory
        mode: '0755'

    - import_tasks: tasks/ssl_httpd.yml
    - import_tasks: tasks/firewall.yml

    - name: Configura le porte di ascolto globali nei Workers (81 e 444)
      copy:
        dest: /etc/httpd/conf.d/ports.conf
        content: |
          Listen 81
          Listen 444
        mode: '0644'

    - name: Avvia e abilita il servizio Apache
      service:
        name: httpd
        state: restarted
        enabled: true

- name: Configura il Bilanciatore Dinamico (Load Balancer)
  hosts: loadbalancer
  become: true
  vars:
    lb_ip_address: "{{ ansible_host | default('192.168.56.10') }}"
  tasks:
    - name: Installa Apache e mod_ssl sul Load Balancer
      dnf:
        name:
          - httpd
          - mod_ssl
        state: present
        update_cache: true

    - name: Assicura la presenza della directory conf.d
      file:
        path: /etc/httpd/conf.d
        state: directory
        mode: '0755'

    - import_tasks: tasks/ssl_httpd.yml
    - import_tasks: tasks/firewall.yml

    - name: Configura le porte globali sul Load Balancer
      copy:
        dest: /etc/httpd/conf.d/ports.conf
        content: |
          Listen 81
          Listen 444
        mode: '0644'

    - name: Crea configurazione LB dinamica (Porte 81/444)
      copy:
        dest: /etc/httpd/conf.d/load_balancer.conf
        content: |
          <Proxy "balancer://my_backend">
              # I nodi worker rispondono sulla 444 (HTTPS)
              BalancerMember https://192.168.56.11:444
              BalancerMember https://192.168.56.12:444
              ProxySet lbmethod=byrequests
          </Proxy>

          <VirtualHost *:81>
              ServerName {{ lb_ip_address }}
              Redirect permanent / https://{{ lb_ip_address }}:444/
          </VirtualHost>

          <VirtualHost *:444>
              ServerName {{ lb_ip_address }}

              SSLEngine on
              SSLCertificateFile /etc/httpd/ssl/cert.pem
              SSLCertificateKeyFile /etc/httpd/ssl/key.pem

              ProxyPreserveHost On
              ProxyPass / balancer://my_backend/
              ProxyPassReverse / balancer://my_backend/
              
              SSLProxyEngine on
              SSLProxyVerify none
              SSLProxyCheckPeerCN off
              SSLProxyCheckPeerName off
          </VirtualHost>
        mode: '0644'

    - name: Abilita httpd_can_network_connect per SELinux
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: yes

    - name: Avvia e abilita Apache sul Load Balancer
      service:
        name: httpd
        state: restarted
        enabled: true
      tags: apache