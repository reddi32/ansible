---
# 1. PLAY PER I WEBSERVER (Installazione e Configurazione)
- name: Verifica, Installa e Configura Apache sui Webservers
  hosts: webservers
  become: yes
  vars:
    httpd_port: 81
  tasks:
    - name: Controlla se il processo httpd è in esecuzione
      shell: pgrep httpd
      register: httpd_process
      ignore_errors: yes
      changed_when: false

    - name: Fallisci se httpd è già in esecuzione
      fail:
        msg: "Il processo httpd è già in esecuzione. Interrompo."
      when: httpd_process.rc == 0

    - name: Installa Apache e i moduli indispensabili
      dnf:
        name: 
          - httpd
          - mod_ssl
          - openssl
        state: present
        update_cache: true

    - name: Verifica esistenza del file di configurazione Apache
      stat:
        path: /etc/httpd/conf/httpd.conf
      register: httpd_conf_stat

    - name: Crea placeholder di httpd.conf se mancante (solo se pacchetto httpd installato)
      copy:
        dest: /etc/httpd/conf/httpd.conf
        content: |
          # placeholder httpd.conf creato da Ansible
          Listen 80
        owner: root
        group: root
        mode: '0644'
      when:
        - httpd_conf_stat.stat.exists == False
        - "'httpd' in ansible_facts.packages or ansible_facts.os_family == 'RedHat'"
      # opzionale: rimuovi se preferisci non creare placeholder

    - name: Modifica la porta di ascolto di Apache da 80 a {{ httpd_port }}
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen'
        line: "Listen {{ httpd_port }}"
        create: yes
        backup: yes

    - name: Ensure semanage (policycoreutils) is installed for SELinux port management
      dnf:
        name: policycoreutils-python-utils
        state: present
        update_cache: yes

    - name: Ottieni lista porte SELinux per http_port_t
      shell: semanage port -l | awk '/http_port_t/ {print $2 " " $3}'
      register: selinux_ports
      changed_when: false
      failed_when: false

    - name: Aggiungi la porta {{ httpd_port }} a SELinux (solo se mancante)
      command: semanage port -a -t http_port_t -p tcp {{ httpd_port }}
      args:
        warn: false
      when: "'tcp {{ httpd_port }}' not in selinux_ports.stdout"

    - name: Crea la pagina di benvenuto di Apache
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <body>
          <h1>Apache è stato installato con successo su Fedora!</h1>
          </body>
          </html>

    - name: Includi task SSL e Firewall
      include_tasks: "{{ item }}"
      loop:
        - tasks/firewall.yml
        - tasks/ssl_httpd.yml

    - name: Avvia Apache
      service:
        name: httpd
        state: restarted
        enabled: true

# 2. PLAY PER IL BILANCIATORE (Configurazione Proxy)
- name: Configura il bilanciatore di carico
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Permetti al bilanciatore di connettersi ai backend (SELinux)
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Crea configurazione per il bilanciatore di carico
      copy:
        dest: /etc/httpd/conf.d/load_balancer.conf
        content: |
          <Proxy "balancer://mycluster">
              BalancerMember "http://172.16.106.131:81"
              BalancerMember "http://172.16.106.132:81"
          </Proxy>
          <Location "/">
              ProxyPass "balancer://mycluster/"
              ProxyPassReverse "balancer://mycluster/"
          </Location>
      notify: Riavvia Apache LB

  handlers:
    - name: Riavvia Apache LB
      service:
        name: httpd
        state: restarted