- name: Installa e configura Apache con SSL e Firewall (nodi)
  hosts: webservers
  become: true
  tasks:
    - name: verifica se Apache è installato
      dnf:
        name: httpd
        state: present
        update_cache: true

    - name: configura Apache per ascoltare sulla porta 81 e 444
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen 80'
        line: 'Listen 81'

    - name: crea la directory per il sito web di Apache
      file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - import_tasks: tasks/ssl_httpd.yml
    - import_tasks: tasks/firewall.yml

    - name: avvia e abilita Apache
      service:
        name: httpd
        state: started
        enabled: true

- name: Configura il Bilanciatore Dinamico (load balancer)
  hosts: loadbalancer
  become: true
  vars:
    lb_ip_address: "{{ lb_ip_address | default('loadbalancer.example.com') }}"
  tasks:
    - name: Installa Apache e mod_ssl sul LB
      dnf:
        name: 
          - httpd
          - mod_ssl
        state: present
        update_cache: true

    - name: configura porte globali sul Load Balancer
      copy:
        dest: /etc/httpd/conf.d/ports.conf
        content: |
          Listen 81
          Listen 444

    - import_tasks: tasks/ssl_httpd.yml
    - import_tasks: tasks/firewall.yml

    - name: Crea configurazione LB dinamica (Porte 81/444)
      copy:
        dest: /etc/httpd/conf.d/load_balancer.conf
        content: |
          <Proxy "balancer://my_backend">
              # I nodi rispondono sulla 444 (HTTPS)
              BalancerMember https://172.16.106.131:444
              BalancerMember https://172.16.106.132:444
              ProxySet lbmethod=byrequests
          </Proxy>

          <VirtualHost *:81>
              ServerName {{ lb_ip_address }}
              Redirect permanent / https://{{ lb_ip_address }}:444/
          </VirtualHost>

          <VirtualHost *:444>
              ServerName {{ lb_ip_address }}

              SSLEngine on
              SSLCertificateFile /etc/pki/tls/certs/apache-selfsigned.crt
              SSLCertificateKeyFile /etc/pki/tls/private/apache-selfsigned.key

              ProxyPreserveHost On
              ProxyPass / balancer://my_backend/
              ProxyPassReverse / balancer://my_backend/
              
              SSLProxyEngine on
              SSLProxyVerify none
              SSLProxyCheckPeerCN off
              SSLProxyCheckPeerName off
          </VirtualHost>

    - name: abilita httpd_can_network_connect per SELinux
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: yes

    - name: Autorizza le porte 81 e 444 su SELinux
      community.general.seport:
        ports: 81,444
        proto: tcp
        setype: http_port_t
        state: present
    
    - name: avvia e abilita Apache sul LB
      service:
        name: httpd
        state: restarted # Restart per applicare il cambio porte
        enabled: true