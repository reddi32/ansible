---
# 1. PLAY PER I WEBSERVER (Installazione e Configurazione)
- name: Verifica, Installa e Configura Apache sui Webservers
  hosts: webservers
  become: yes
  vars:
    httpd_port: 81
  tasks:
    - name: Controlla se il processo httpd è in esecuzione
      shell: pgrep httpd
      register: httpd_process
      ignore_errors: yes
      changed_when: false

    - name: Fallisci se httpd è già in esecuzione
      fail:
        msg: "Il processo httpd è già in esecuzione. Interrompo."
      when: httpd_process.rc == 0

    - name: Installa Apache e i moduli indispensabili
      dnf:
        name: 
          - httpd
          - mod_ssl
          - openssl
        state: present
        update_cache: true

    - name: Stat httpd
      stat:
        path: /etc/httpd/conf/httpd.conf
      register: stat_httpd
      changed_when: false

    - name: Stat port
      stat:
        path: /etc/apache2/ports.conf
      register: stat_apache2
      changed_when: false

    - name: Imposta httpd_conf_path in base ai file esistenti
      set_fact:
        httpd_conf_path: "{{ '/etc/httpd/conf/httpd.conf' if stat_httpd.stat.exists else ('/etc/apache2/ports.conf' if stat_apache2.stat.exists else '/etc/httpd/conf/httpd.conf') }}"
      changed_when: false

    - name: Crea placeholder di httpd.conf se mancante (solo se nessun file di conf esiste)
      copy:
        dest: "{{ httpd_conf_path }}"
        content: |
          # placeholder httpd.conf creato da Ansible
          Listen 80
        owner: root
        group: root
        mode: '0644'
      when: not (stat_httpd.stat.exists or stat_apache2.stat.exists)

    - name: Modifica la porta di ascolto di Apache da 80 a {{ httpd_port }}
      lineinfile:
        path: "{{ httpd_conf_path }}"
        regexp: '^Listen'
        line: "Listen {{ httpd_port }}"
        create: yes
        backup: yes

    - name: abilita httpd_can_network_connect per SELinux
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: yes
        
    - name: Crea la pagina di benvenuto di Apache
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <body>
          <h1>Apache è stato installato con successo su Fedora!</h1>
          </body>
          </html>

    - name: Includi task SSL e Firewall
      include_tasks: "{{ item }}"
      loop:
        - tasks/firewall.yml
        - tasks/ssl_httpd.yml

    - name: Avvia Apache
      service:
        name: httpd
        state: restarted
        enabled: true

# 2. PLAY PER IL BILANCIATORE (Configurazione Proxy)
- name: Configura il bilanciatore di carico
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Permetti al bilanciatore di connettersi ai backend (SELinux)
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Crea configurazione per il bilanciatore di carico
      copy:
        dest: /etc/httpd/conf.d/load_balancer.conf
        content: |
          <Proxy "balancer://mycluster">
              BalancerMember "http://172.16.106.131:81"
              BalancerMember "http://172.16.106.132:81"
          </Proxy>
          <Location "/">
              ProxyPass "balancer://mycluster/"
              ProxyPassReverse "balancer://mycluster/"
          </Location>
      notify: Riavvia Apache LB

  handlers:
    - name: Riavvia Apache LB
      service:
        name: httpd
        state: restarted